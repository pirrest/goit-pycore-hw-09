[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant"
version = "0.1.0"
description = "Command-line personal assistant for contacts and notes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pirrest", email = "pirrest@gmail.com" }]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Repository = "https://github.com/pirrest/goit-pycore-hw-09"

[project.scripts]
assistant = "personal_assistant.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
